<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color Pattern Reg</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="panel-shell">
      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">Visible Palette Intelligence</p>
          <h1>Color Pattern Reg</h1>
          <p class="hero-text">
            用 DOM 语义和当前视口截图快速识别网页配色，并导出成可复用 token。
          </p>
        </div>
        <div class="hero-actions">
          <button id="analyzeButton" class="primary-button">Analyze 当前页面</button>
          <p id="statusText" class="status-text">等待页面分析</p>
        </div>
      </section>

      <section id="warningList" class="warning-list" hidden></section>

      <section id="summaryGrid" class="summary-grid" hidden></section>

      <section class="content-grid">
        <article class="panel-card">
          <div class="section-heading">
            <h2>主配色</h2>
            <p>按融合权重排序</p>
          </div>
          <div id="swatchList" class="swatch-list empty-state">
            还没有可展示的颜色结果。
          </div>
        </article>

        <article class="panel-card">
          <div class="section-heading">
            <h2>语义角色</h2>
            <p>适合直接映射设计 token</p>
          </div>
          <div id="roleList" class="role-list empty-state">
            识别完成后会在这里显示 primary、background、text、surface。
          </div>
        </article>
      </section>

      <section class="content-grid">
        <article class="panel-card export-card">
          <div class="section-heading">
            <h2>导出</h2>
            <p>下载成设计或开发可用格式</p>
          </div>
          <div class="export-actions">
            <button data-export="json" class="secondary-button">Export JSON</button>
            <button data-export="css" class="secondary-button">Export CSS Vars</button>
            <button data-export="tailwind" class="secondary-button">Export Tailwind</button>
          </div>
        </article>

        <article class="panel-card preview-card">
          <div class="section-heading">
            <h2>截图预览</h2>
            <p>当前视口像素权重来源</p>
          </div>
          <img id="previewImage" class="preview-image" alt="Page preview" hidden />
          <div id="previewEmpty" class="empty-state">
            点击 Analyze 后会显示当前视口截图。
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
